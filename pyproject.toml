[project]
name = "sash"
version = "0.1.0"
description = "POSIX sh reader/parser with scope-set variable binding"
requires-python = ">=3.12"
# Dependencies are managed by Nix — add them to `projectDeps` in flake.nix,
# not here. This list stays empty so pip/uv never resolve anything.
dependencies = []

[project.scripts]
sash = "sash.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sash"]

[tool.black]
line-length = 88

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pytest"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
